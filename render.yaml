services:
  - type: web
    name: farmbot-api
    runtime: python
    plan: free             # Ucretsiz plan: 15 dk trafik yoksa uyur, kalici disk yok.
    rootDir: sunucu
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saglik
    envVars:
      - key: AJAN_JETONU
        generateValue: true   # Render rastgele uretir; Pi'deki ayarlar.json'a kopyalayin
      - key: PANEL_PAROLA
        sync: false           # Panel parolasini Render panelinden elle girin
